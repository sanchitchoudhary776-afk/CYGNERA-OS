<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="AXINITE OS — The AI-powered study platform that adapts to you" />
    <meta name="theme-color" content="#09cd83" />

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Axinite" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>AXINITE OS</title>

    <!-- Preloading Material Symbols to prevent text flashes -->
    <link rel="preload" href="/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Detect when font is fully parsed and ready -->
    <script>
      if ('fonts' in document) {
        document.fonts.load('1em "Material Symbols Outlined"').then(function() {
          document.documentElement.classList.add('fonts-loaded');
        });
      } else {
        document.documentElement.classList.add('fonts-loaded');
      }
    </script>

    <!-- Primary UI Fonts (Eager) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet" />
    
    <!-- Secondary/Editor Theme Fonts (Lazy) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Poppins:wght@400;700&family=Lato:wght@400;700&family=Open+Sans:wght@400;700&family=Patrick+Hand&family=Caveat+Brush&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Poppins:wght@400;700&family=Lato:wght@400;700&family=Open+Sans:wght@400;700&family=Patrick+Hand&family=Caveat+Brush&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet" />
    </noscript>

    <style>
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 100 700;
        src: url('/material-symbols-outlined.woff2') format('woff2');
        font-display: block;
      }
      /* Critical: prevent flash of unstyled content + native app baseline */
      html {
        background: #0e1510;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      #root { min-height: 100dvh; }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 200, 'opsz' 24;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Prevent ugly fallback text flash before the icon font loads */
      html:not(.fonts-loaded) .material-symbols-outlined {
        color: transparent !important;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #161d18; }
      ::-webkit-scrollbar-thumb { background: #3c4a40; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #09cd83; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
